name: Sincronizar con repositorio original

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar tu repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Traer cambios del original y guardar
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git remote add upstream https://github.com/ItsNotRexed/Leonida.git
          git fetch upstream
          git merge upstream/main --no-commit --no-ff --allow-unrelated-histories
          git reset HEAD -- .github/workflows/
          git checkout -- .github/workflows/
          git clean -fd .github/workflows/
          if ! git diff --cached --quiet; then
            git commit -m "Sincronizar con repositorio original"
            git push origin main
          else
            echo "No hay cambios nuevos que subir."
          fi
